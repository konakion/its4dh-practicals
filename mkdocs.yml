site_name: "ITS4DH Practical Lab"
site_url: https://konakion.github.io/its4dh-practicals/
site_description: Interactive 90-minute practicals for HPI Digital Health students, with real Linux running in the browser.
strict: true
use_directory_urls: true
theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html
plugins: []
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
nav:
  - Practical lab: index.md
  - "Practical 01: OS fundamentals": practical-01.md
  - "Practical 02: Processes & threads": practical-02.md
  - "Practical 03: IPC & scheduling": practical-03.md
  - About: about.md
