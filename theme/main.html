<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page and page.is_homepage %}{{ config.site_name }}{% else %}{{ page.title }} | {{ config.site_name }}{% endif %}</title>
  <meta name="description" content="{{ config.site_description }}">
  <meta name="theme-color" content="#0f2529">
  <link rel="icon" href="{{ 'assets/favicon.svg' | url }}" type="image/svg+xml">
  <link rel="preload" href="{{ 'assets/fonts/atkinson-hyperlegible-latin-400-normal.woff2' | url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ 'assets/practical.css' | url }}">
</head>
{% if page and page.is_homepage %}
<body class="app-page">
  <div id="practical" class="layout">{{ page.content }}</div>
  <script src="{{ 'assets/linux-session.js' | url }}"></script>
  <script src="{{ 'assets/practical-01.js' | url }}"></script>
  <script src="{{ 'assets/course-app.js' | url }}"></script>
</body>
{% else %}
<body class="doc-page">
  <main class="doc">
    <a class="doc-back" href="{{ nav.homepage.url | url }}">Back to the practical</a>
    {{ page.content }}
  </main>
</body>
{% endif %}
</html>
